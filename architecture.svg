<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1B3358"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="#FFFFFF"/>

  <text x="500" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#1B3358">NC-Track — System Architecture</text>

  <!-- Client Layer -->
  <text x="500" y="80" text-anchor="middle" font-size="13" fill="#8A8A8A">CLIENT LAYER (React + Vite + TypeScript, offline-first PWA)</text>
  <g>
    <rect x="60" y="95" width="230" height="70" rx="8" fill="#EEF2F7" stroke="#1B3358" stroke-width="1.5"/>
    <text x="175" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B3358">Operator Portal</text>
    <text x="175" y="142" text-anchor="middle" font-size="11" fill="#444">Submit NC utilization data</text>

    <rect x="385" y="95" width="230" height="70" rx="8" fill="#EEF2F7" stroke="#1B3358" stroke-width="1.5"/>
    <text x="500" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B3358">Zonal Officer App</text>
    <text x="500" y="142" text-anchor="middle" font-size="11" fill="#444">Offline field inspection &amp; sync</text>

    <rect x="710" y="95" width="230" height="70" rx="8" fill="#EEF2F7" stroke="#1B3358" stroke-width="1.5"/>
    <text x="825" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B3358">HQ Reviewer Dashboard</text>
    <text x="825" y="142" text-anchor="middle" font-size="11" fill="#444">Compliance analytics &amp; reports</text>
  </g>

  <!-- Arrows down to API -->
  <line x1="175" y1="165" x2="175" y2="205" stroke="#1B3358" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="165" x2="500" y2="205" stroke="#1B3358" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="825" y1="165" x2="825" y2="205" stroke="#1B3358" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- API Layer -->
  <text x="500" y="200" text-anchor="middle" font-size="13" fill="#8A8A8A">API &amp; AUTH LAYER</text>
  <rect x="60" y="210" width="880" height="80" rx="8" fill="#1B3358"/>
  <text x="220" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">API Gateway + Lambda</text>
  <text x="220" y="265" text-anchor="middle" font-size="11" fill="#DCE3EC">Submission &amp; scorecard endpoints</text>

  <line x1="360" y1="250" x2="360" y2="250" stroke="#FFFFFF"/>
  <text x="500" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">Cognito</text>
  <text x="500" y="265" text-anchor="middle" font-size="11" fill="#DCE3EC">Role-based auth (4 roles)</text>

  <text x="780" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">NC Scorecard Engine</text>
  <text x="780" y="265" text-anchor="middle" font-size="11" fill="#DCE3EC">Rules engine vs. NOGICD thresholds</text>

  <line x1="290" y1="250" x2="290" y2="250" stroke="none"/>
  <line x1="710" y1="250" x2="710" y2="250" stroke="none"/>
  <line x1="290" y1="210" x2="290" y2="290" stroke="#3E5A82" stroke-width="1"/>
  <line x1="640" y1="210" x2="640" y2="290" stroke="#3E5A82" stroke-width="1"/>

  <!-- Arrow down to data layer -->
  <line x1="500" y1="290" x2="500" y2="330" stroke="#1B3358" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Data Layer -->
  <text x="500" y="325" text-anchor="middle" font-size="13" fill="#8A8A8A">DATA LAYER</text>
  <g>
    <rect x="60" y="335" width="270" height="75" rx="8" fill="#F4EBD0" stroke="#B8860B" stroke-width="1.5"/>
    <text x="195" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#7A5C00">DynamoDB</text>
    <text x="195" y="385" text-anchor="middle" font-size="11" fill="#555">Submissions, scores, audit log</text>

    <rect x="365" y="335" width="270" height="75" rx="8" fill="#F4EBD0" stroke="#B8860B" stroke-width="1.5"/>
    <text x="500" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#7A5C00">S3</text>
    <text x="500" y="385" text-anchor="middle" font-size="11" fill="#555">Evidence documents (contracts, certs)</text>

    <rect x="670" y="335" width="270" height="75" rx="8" fill="#F4EBD0" stroke="#B8860B" stroke-width="1.5"/>
    <text x="805" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#7A5C00">SNS</text>
    <text x="805" y="385" text-anchor="middle" font-size="11" fill="#555">Non-compliance &amp; deadline alerts</text>
  </g>

  <!-- Offline sync loop -->
  <path d="M 500 205 C 900 205, 950 300, 805 335" fill="none" stroke="#8A8A8A" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="960" y="270" font-size="10" fill="#8A8A8A" text-anchor="middle" transform="rotate(90 960,270)">alerts to client</text>

  <!-- Legend / notes -->
  <rect x="60" y="440" width="880" height="200" rx="8" fill="#FAFAFA" stroke="#DDDDDD"/>
  <text x="80" y="470" font-size="14" font-weight="bold" fill="#1B3358">Notes</text>
  <text x="80" y="495" font-size="12" fill="#333">• Offline-first: Operator and Zonal Officer clients cache submissions locally and sync via IndexedDB/DataStore when connectivity returns.</text>
  <text x="80" y="518" font-size="12" fill="#333">• Scorecard Engine runs on every submission, not on a schedule — compliance status is always current.</text>
  <text x="80" y="541" font-size="12" fill="#333">• Evidence files are content-hashed on upload to S3 so audit trail entries can prove a document has not changed.</text>
  <text x="80" y="564" font-size="12" fill="#333">• Firebase equivalent for a lighter capstone build: Firestore (DynamoDB), Cloud Storage (S3), Firebase Auth (Cognito),</text>
  <text x="98" y="585" font-size="12" fill="#333">Cloud Functions (Lambda), FCM (SNS).</text>
  <text x="80" y="610" font-size="12" fill="#333">• HQ Reviewer Dashboard reads directly from the data layer via a reporting query layer — no separate data warehouse needed at capstone scale.</text>
</svg>
